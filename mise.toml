[env]
_.path = [
  "${XDG_CONFIG_HOME:-$HOME/.config}/vite-plus/bin",
  "node_modules/.bin",
  "node_modules/.pnpm/node_modules/.bin",
]

[tools]
"aqua:owenlamont/ryl" = "latest"
"npm:@commitlint/cli" = "latest"
