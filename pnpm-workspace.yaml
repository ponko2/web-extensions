packages:
  - packages/*
allowBuilds:
  esbuild: true
  spawn-sync: true
catalog:
  "@tsconfig/strictest": 2.0.8
  "@types/node": 24.19.1
  "@wxt-dev/storage": ^1.3.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  wxt: 0.21.4
catalogMode: prefer
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
