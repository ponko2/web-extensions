packages:
  - packages/*
allowBuilds:
  esbuild: true
  spawn-sync: true
catalog:
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@commitlint/types": 21.2.0
  "@tsconfig/strictest": 2.0.8
  "@types/node": 24.13.3
  "@wxt-dev/storage": ^1.2.9
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  wxt: 0.21.3
catalogMode: prefer
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
